<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>half-it</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>half-it</h1>
      <p class="lead">このページは GitHub Pages の動作確認用なのだ。</p>

      <section class="check">
        <h2>読み込みチェック</h2>
        <p id="css-status" class="status">CSS がこの箱に色を付けていれば読み込み成功なのだ</p>
        <p id="js-status" class="status status--pending">JS 未読み込み（このままなら JS が動いていないのだ）</p>
        <button id="check-button" type="button">クリックして JS を試す</button>
      </section>

      <footer class="footer">
        <p>素の HTML / CSS / JavaScript だけで作っているのだ。</p>
      </footer>
    </main>
  </body>
</html>
